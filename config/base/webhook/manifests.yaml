---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: controller-template-webhook
      namespace: system
      path: /mutate-example-miloapis-com-v1alpha1-resource
  failurePolicy: Fail
  name: mresource.kb.io
  rules:
  - apiGroups:
    - example.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - resources
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: controller-template-webhook
      namespace: system
      path: /validate-example-miloapis-com-v1alpha1-resource
  failurePolicy: Fail
  name: vresource.kb.io
  rules:
  - apiGroups:
    - example.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - resources
  sideEffects: None
