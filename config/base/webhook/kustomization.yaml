apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
# manifests.yaml is generated by controller-gen and should NOT be edited
# directly — `task manifests` will overwrite it.
- manifests.yaml

# Teach kustomize about the webhook clientConfig.service.{name,namespace}
# field paths so the namespace transform and nameReference handle them automatically.
configurations:
- kustomizeconfig.yaml

patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: controller-template-mutating
  target:
    kind: MutatingWebhookConfiguration
    name: mutating-webhook-configuration
- patch: |-
    - op: replace
      path: /metadata/name
      value: controller-template-validating
  target:
    kind: ValidatingWebhookConfiguration
    name: validating-webhook-configuration
